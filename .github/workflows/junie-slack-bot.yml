# Runs the Junie Slack bot as a standalone Junie agent.
#
# See .junie-live/slack-bot.yaml for the agent's profile, and
# https://github.com/JetBrains/junie-slack-bot for the action itself.
name: Junie Slack Bot (Junie Live)

on:
  # The bot is restarted every four hours; backend.state in the profile
  # restores its conversation across restarts.
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: { }

concurrency:
  group: junie-slack-bot-live
  # Keep a running bot alive when the next scheduled run appears.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # `path` must match the repository `path` in .junie-live/slack-bot.yaml.
      # The agent's workspace is the parent of this directory.
      - uses: actions/checkout@v4
        with:
          path: mps
          fetch-depth: 0
          # Let the agent's Smart HTTP push supply its own run-scoped
          # credential/header instead of the token actions/checkout would
          # otherwise persist into the local gitconfig.
          persist-credentials: false

      - name: Run Junie Live agent
        # Pinned to main rather than the v1 tag: v1 predates the zstd install
        # the agent needs to restore its state snapshot, and lacks the live-log
        # inputs. Re-pin to a commit SHA if upstream churn becomes a problem.
        uses: jetbrains/junie-slack-bot/.github/actions/run-agent@main
        with:
          config: mps/.junie-live/slack-bot.yaml
          workspace: ${{ github.workspace }}
          junie-live-version: latest
          use-sandbox: "true"
          run-id-prefix: github-slack-bot
          log-artifact-name: junie-slack-bot-logs
          log-retention-days: "7"
          # Secrets consumed by the credential proxy only; they never enter the
          # agent process. Every ${VAR} in the profile needs a line here.
          #
          # The teamcity MCP server in the profile is disabled; re-enable it by
          # adding TEAMCITY_TOKEN=${{ secrets.TEAMCITY_TOKEN }} to the block
          # below. Keep such notes *outside* the block: inside a YAML literal
          # block a leading "#" is ordinary text, not a comment, so a commented
          # entry indented to match its neighbours would be passed through as a
          # bogus env line.
          configuration-envs: |
            JUNIE_SLACK_BOT_JUNIE_API_KEY=${{ secrets.JUNIE_SLACK_BOT_JUNIE_API_KEY }}
            JUNIE_SLACK_BOT_BACKEND_TOKEN=${{ secrets.JUNIE_SLACK_BOT_BACKEND_TOKEN }}
            YOUTRACK_TOKEN=${{ secrets.YOUTRACK_TOKEN }}
          # Visible to the agent process itself.
          agent-envs: |
            TZ=Europe/Berlin
