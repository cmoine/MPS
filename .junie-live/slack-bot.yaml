# Junie Live profile for the Junie Slack bot in JetBrains/MPS-development.
#
# Started by .github/workflows/junie-slack-bot.yml via the run-agent action of
# JetBrains/junie-slack-bot; every ${VAR} below comes from that workflow's
# `configuration-envs` block and must have a matching line there.
#
# Layout: single-repository. This repository is private, so the profile, the
# workflow and the secrets all live here (a meta-repository is only required
# for a public repository or a multi-repository bot).
schema-version: 1
profile: slack-bot

git:
  # Push over Git's Smart HTTP protocol. The Junie Live backend authorises the
  # push with a run-scoped JWT injected as an HTTP header, so this transport
  # must be used instead of the classic dumb/credential-helper path. It keeps
  # the header rules intact and never overlays the global gitconfig identity.
  transport: smart-http

  # Branches the agent is allowed to push to; everything else (including
  # master) is denied.
  allowed-branches: ["slack-bot/*"]

  commit-identity:
    name: Junie The Developer
    email: junie-live-agent@users.noreply.github.com

  # The default `github` connection: the supervisor mints short-lived GitHub
  # App installation tokens from the Junie Live backend, so no App key or
  # installation id enters the workflow. This requires the "Junie the
  # Developer" GitHub App to be installed on the repository.
  connections:
    github:
      repositories:
        # `path` must match the `path:` of the actions/checkout step in the
        # workflow. The workspace is the *parent* of all checkouts, so the
        # repository lives in a subdirectory rather than at the workspace root.
        - url: https://github.com/JetBrains/MPS-development.git
          path: mps
          # This repository's default branch is master, not main.
          branch: master
          # actions/checkout records origin without the .git suffix, but the
          # Smart HTTP route matches the exact .git URL. The CLI rewrites the
          # remote to that exact URL at startup by default, so no workflow step
          # is needed.

slack:
  # Slack traffic is routed through the Junie Live backend, which owns the
  # Slack app and its tokens, so no real Slack tokens are needed here.
  bot-token: "not-needed"
  app-token: "not-needed"
  # The allow-listed channels the bot listens in. Invite the bot to each one
  # with /invite @<bot>.
  channels:
    - name: mps
      id: C0325BGQV # the C... part of the channel link
  # Users allowed to DM the bot; drop this block if DMs are not wanted.
  dm_allowed_user_ids:
    - U03S76MNG # Vaclav
    - U031UNUQJ # Alex
  respond-in-threads: true

backend:
  backend_url: https://junie-live-staging-ext.labs.jb.gg
  project_id: d1fde37b-af5c-4033-8f4a-61d6bcad9310
  token: ${JUNIE_SLACK_BOT_BACKEND_TOKEN}
  # Snapshot the agent's state on shutdown and restore it on the next start,
  # so the bot survives the scheduled 4-hourly restarts without losing
  # context. Restoring shells out to zstd, which the action installs.
  state:
    enabled: true
    checkpoint_interval_seconds: 300
    fail_if_not_restored: true

ingrazzio:
  api-key: ${JUNIE_SLACK_BOT_JUNIE_API_KEY}

agent-settings:
  junie-cli:
    model:
      - id: grok-4.6
        provider: ingrazzio/xai

web-search:
  provider: ingrazzio/tavily
  headers:
    X-Accept-EAP-License: "true"

# Credential-bearing remote MCP servers: the credential proxy replaces each
# url + Authorization header with a run-scoped loopback capability, so the
# agent never sees the real token. An MCP host therefore needs no entry in
# sandbox.network.allowed-domains.
#
# The teamcity server is disabled: re-enable it together with the matching
# TEAMCITY_TOKEN line in the workflow's configuration-envs, or neither.
mcp:
  servers:
    - name: youtrack
      url: https://youtrack.jetbrains.com/mcp
      auth-header: Bearer ${YOUTRACK_TOKEN}
#    - name: teamcity
#      # MPS CI lives on teamcity.jetbrains.com (see build/ivysettings.xml);
#      # the upstream example points at a different, internal TC instance.
#      url: https://teamcity.jetbrains.com/app/mcp
#      auth-header: Bearer ${TEAMCITY_TOKEN}

sandbox:
  network:
    # Exact hosts the sandboxed agent may reach directly (wildcards only as
    # "*.example.com"). Slack, the backend, Ingrazzio and the MCP servers are
    # absent on purpose: the agent reaches those through loopback capabilities
    # and the supervisor makes the real calls.
    allowed-domains:
      - github.com
      - api.github.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      - raw.githubusercontent.com
      - ingrazzio-cloud-prod.labs.jb.gg
      # allow uploading files directly to signed upload URLs in slack
      - files.slack.com
      - hooks.slack.com
      # Dependency resolution for this project: the Ivy resolvers configured
      # in build/ivysettings.xml. teamcity.jetbrains.com is needed here only for
      # the unauthenticated /guestAuth/ artifact downloads, so the agent gets
      # guest-level read access and no credential of any kind.
      - teamcity.jetbrains.com
      - repo1.maven.org
      - repository.jetbrains.com
    endpoint-proxies: []

hermes:
  dashboard: false
